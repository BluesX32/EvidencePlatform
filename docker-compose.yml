version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
      POSTGRES_DB: evidenceplatform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidenceplatform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://evidence:evidence@db:5432/evidenceplatform
      SECRET_KEY: ${SECRET_KEY:-change-me-use-a-strong-random-key}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-24}
      # All browser traffic goes through the Vite proxy so CORS is only needed
      # for direct API access (e.g. Swagger UI).  The frontend URL is enough.
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173}
      INVITE_REQUIRED: ${INVITE_REQUIRED:-true}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      # Used by entrypoint.sh to wait for Postgres before migrating.
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: evidence
      DB_NAME: evidenceplatform
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Tells the Vite dev-server proxy where to forward API requests.
      # Uses the Docker service name so it works on any machine / AWS instance.
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume keeps node_modules inside the container (Linux binaries,
      # no host platform mismatch).  CMD runs `npm install --prefer-offline`
      # on every start to sync newly added packages without a full rebuild.
      #
      # To reset node_modules only (e.g. after adding npm packages):
      #   docker compose stop frontend
      #   docker volume rm evidenceplatform_frontend_nm
      #   docker compose up --build frontend
      - frontend_nm:/app/node_modules

volumes:
  # pgdata is NEVER removed by docker compose down.
  # To wipe the database intentionally: docker volume rm evidenceplatform_pgdata
  pgdata:
    external: false
  frontend_nm:
    external: false
